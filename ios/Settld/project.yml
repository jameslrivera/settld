name: Settld
options:
  bundleIdPrefix: xyz.settld
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: XPHBL8575L
targets:
  Settld:
    type: application
    platform: iOS
    sources: [Sources, Resources]
    entitlements:
      path: Settld.entitlements
      properties:
        com.apple.developer.nfc.readersession.formats: [TAG, NDEF]
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Settld
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NFCReaderUsageDescription: Settld reads the serial number of a Settld card to open an account and to pay.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Settld talks to the authorization service on your local network.
        NSMicrophoneUsageDescription: Settld listens when you ask your agent to buy something.
        NSSpeechRecognitionUsageDescription: Settld turns what you say into a request for your agent, on this phone.
        NSFaceIDUsageDescription: Settld confirms it is you before an agent's purchase is approved.
        UIUserInterfaceStyle: Dark
        LSApplicationQueriesSchemes: [solana, phantom]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.settld.card
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
